apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
  namespace: audiobookshelf
spec:
  template:
    metadata:
      labels:
        app: transmission
      annotations:
        kubectl.kubernetes.io/default-container: transmission
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
        - 127.0.0.1
        searches: []
        options:
        - name: ndots
          value: '1'
      initContainers:
      - name: gluetun
        image: qmcgaw/gluetun:v3.41.3
        restartPolicy: Always
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
        env:
        - name: VPN_SERVICE_PROVIDER
          value: custom
        - name: VPN_TYPE
          value: wireguard
        - name: WIREGUARD_IMPLEMENTATION
          value: kernelspace
        - name: FIREWALL
          value: 'on'
        - name: DNS_ADDRESS
          value: 127.0.0.1
        - name: TZ
          value: America/New_York
        - name: HTTP_CONTROL_SERVER_ADDRESS
          value: 127.0.0.1:8000
        - name: PUID
          value: '0'
        - name: PGID
          value: '0'
        startupProbe:
          exec:
            command:
            - /gluetun-entrypoint
            - healthcheck
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - /gluetun-entrypoint
            - healthcheck
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        volumeMounts:
        - name: surfshark-wireguard
          mountPath: /gluetun/wireguard
          readOnly: true
        - name: tun-device
          mountPath: /dev/net/tun
        - name: defaults
          mountPath: /gluetun/auth/config.toml
          subPath: vpn-control.toml
          readOnly: true
        command:
        - /bin/sh
        - -ec
        args:
        - mkdir -p /tmp/gluetun; chmod 700 /tmp/gluetun; exec /gluetun-entrypoint
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: transmission-config
      - name: defaults
        configMap:
          name: transmission-defaults
      - name: audiobooks
        persistentVolumeClaim:
          claimName: audiobooks
      - name: surfshark-wireguard
        secret:
          secretName: surfshark-wireguard
          defaultMode: 256
      - name: tun-device
        hostPath:
          path: /dev/net/tun
          type: CharDevice
